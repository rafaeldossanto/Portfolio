name: CI

on:
  push:
    branches: [dev, hom, main]
  pull_request:
    branches: [dev, hom, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python scripts/check_site.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python scripts/build_site.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portfolio-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  ci:
    if: always()
    needs: [validate, browser, build]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todas as validações aprovadas
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Pipeline não aprovada: ' + ', '.join(failed))
          print('Todas as validações foram aprovadas.')
          PY
